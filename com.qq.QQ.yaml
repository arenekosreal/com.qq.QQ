app-id: com.qq.QQ
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
branch: liteloader
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: qq
separate-locales: false

finish-args:
  - --device=dri

  - --share=ipc
  - --share=network

  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio

  # Filesystems

  # required to fix cursor scaling on wayland
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

  # D-Bus Access
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher

  # System D-Bus Access
  - --system-talk-name=org.freedesktop.login1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'

modules:
  # runtime cups is built against openssl
  # need cups with gnutls for qq to load gnutls func
  - name: cups
    config-opts:
      - --with-components=all
      - --with-dbusdir=/etc/dbus-1
      - --with-systemd
      - --with-tls=gnutls
      - --with-cups-group=lp
      - --with-system-groups=wheel
      - --with-rundir=/run/cups
      - localedir=/usr/share/locale
    no-make-install: true
    post-install:
      - install -Dm755 cups/libcups.so $FLATPAK_DEST/lib/libcups.so.2
    sources:
      - type: git
        url: https://github.com/OpenPrinting/cups.git
        tag: v2.4.19
        commit: 6ba0487abb05afc93d639f37676add8fd65d3756
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: kerberos
    subdir: src
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.1.tar.gz
        sha256: 1a8832b8cad923ebbf1394f67e2efcf41e3a49f460285a66e35adec8fa0053af

  - name: fontconfig
    buildsystem: simple
    build-commands:
      - install -pDm644 "local.conf" -t "/app/etc/fonts/";
      - install -pDm644 "70-noto-cjk.conf" -t "/app/etc/fonts/conf.d/";
      # `||:` return a successful exit status
      - fc-cache -fsv ||:
    sources:
      - type: file
        url: https://gitlab.archlinux.org/archlinux/packaging/packages/noto-fonts-cjk/-/raw/5fd3534bf7a6e26c7506dc8f40dcd89f37d35627/70-noto-cjk.conf
        sha256: 2417ac0e6720fe8da55ee59f16e36cfe96737bc21432460a322bb0f395e3a521
      - type: file
        path: patch/local.conf
  # For Wayland-only compatibility, workarounding clipboard crash issue
  # https://github.com/flathub/org.flatpak.Builder.BaseApp/blob/branch/25.08/xvfb.json
  - xvfb.json

  - name: qq
    buildsystem: simple
    build-commands:
      - install apply_extra $FLATPAK_DEST/bin
      - install -Dm755 qq.sh $FLATPAK_DEST/bin/qq
      - install -Dm644 com.qq.QQ.metainfo.xml -t $FLATPAK_DEST/share/metainfo
      - install -Dm644 com.qq.QQ.png -t $FLATPAK_DEST/share/icons/hicolor/512x512/apps
      - install -Dm644 com.qq.QQ.desktop -t $FLATPAK_DEST/share/applications
    sources:
      - type: script
        commands:
          - bsdtar --to-stdout -xf qq.deb data.* | bsdtar -xf -
          - mv opt/QQ .
          - rm -rf qq.deb usr opt data.*
          - loader="$(dd if=/dev/urandom bs=15 count=1 status=none | base64 | sed 's|/|_|g;s|+|-|g')"
          - echo "require('/app/lib/node_modules/LiteLoaderQQNT');" > "./QQ/resources/app/app_launcher/$loader.js"
          - sed -i "s|./application.asar/app_launcher/index.js|./app_launcher/$loader.js|" ./QQ/resources/app/package.json
        dest-filename: apply_extra

      - type: file
        path: qq.sh

      - type: file
        path: com.qq.QQ.metainfo.xml

      - type: file
        path: com.qq.QQ.png

      - type: file
        path: com.qq.QQ.desktop

      - type: extra-data
        filename: qq.deb
        only-arches: [x86_64]
        url: https://qqdl.gtimg.cn/qqfile/QQNT/9.9.36/beta/9ee04bef/linuxqq_3.2.34-53644_amd64.deb
        sha256: 436c65e1dd28422e128a21cbddb5fe4e2e6c079d7f27fec2541e014d38cc336e
        size: 187185496
        x-checker-data:
          type: html
          url: https://docs.qq.com/doc/DVXNoRlpKaWhEY015
          pattern: (https://qqdl\.gtimg\.cn/qqfile/QQNT/[^/]+/beta/[^/]+/linuxqq_([^_]+)_amd64\.deb)
          is-main-source: true

      - type: extra-data
        filename: qq.deb
        only-arches: [aarch64]
        url: https://qqdl.gtimg.cn/qqfile/QQNT/9.9.36/beta/9ee04bef/linuxqq_3.2.34-53644_arm64.deb
        sha256: 181b895cb573548e396e54bb0548cca92ffdc1b1a4b018fa4551bb062385fdca
        size: 207538924
        x-checker-data:
          type: html
          url: https://docs.qq.com/doc/DVXNoRlpKaWhEY015
          pattern: (https://qqdl\.gtimg\.cn/qqfile/QQNT/[^/]+/beta/[^/]+/linuxqq_([^_]+)_arm64\.deb)

  - name: liteloader
    buildsystem: simple
    build-commands:
      - mkdir -p $FLATPAK_DEST/lib/node_modules/LiteLoaderQQNT
      - cp -a --no-preserve=ownership -t $FLATPAK_DEST/lib/node_modules/LiteLoaderQQNT LICENSE src package.json
      # https://t.me/LiteLoaderQQNT/1/386748
      - sed -i '104 s/dirent.path/dirent.parentPath/' $FLATPAK_DEST/lib/node_modules/LiteLoaderQQNT/src/main/store.js
    sources:
      - type: archive
        url: https://github.com/LiteLoaderQQNT/LiteLoaderQQNT/releases/download/1.4.1/LiteLoaderQQNT.zip
        sha256: 3b2d9b7214bdfef16d5007b1f277a9f70688785ba11fc03ef091aa8214cdc343
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/LiteLoaderQQNT/LiteLoaderQQNT/releases/latest
          version-query: ".tag_name"
          url-query: ".assets[] | select(.name == \"LiteLoaderQQNT.zip\") | .browser_download_url"
          is-important: true
